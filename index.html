<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Görev listesi</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; color: #1f2328; }
    h1 { font-size: 1.5rem; }
    form { display: flex; gap: .5rem; }
    input[type=text] { flex: 1; padding: .5rem; font-size: 1rem; }
    button { padding: .5rem .9rem; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .5rem; padding: .6rem 0; border-bottom: 1px solid #d0d7de; }
    li span { flex: 1; }
    li span.tamamlandi { text-decoration: line-through; color: #656d76; }
    #bos { color: #656d76; }
    footer { margin-top: 2rem; font-size: .8rem; color: #656d76; }
  </style>
</head>
<body>
  <h1>Görev listesi</h1>
  <form id="ekle-formu">
    <input type="text" id="baslik" placeholder="Yeni görev" autocomplete="off" aria-label="Yeni görev">
    <button type="submit">Ekle</button>
  </form>
  <p id="bos">Henüz görev yok.</p>
  <ul id="liste"></ul>
  <footer>Sürüm: <span id="surum">yerel</span></footer>
  <script type="module" src="src/app.js"></script>
</body>
</html>

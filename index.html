<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stok takip</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 70rem; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    h1 { font-size: 1.5rem; }
    button, input, select { padding: .45rem .7rem; font-size: 1rem; }
    button { cursor: pointer; }
    .kartlar { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-bottom: 1rem; }
    .kart { border: 1px solid #d0d7de; border-radius: .5rem; padding: .75rem 1rem; }
    .kart span { display: block; font-size: .85rem; color: #656d76; }
    .kart strong { font-size: 1.4rem; }
    .arac { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
    .arac input[type=search] { flex: 1; min-width: 10rem; }
    .arac label { display: flex; align-items: center; gap: .3rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #d0d7de; }
    th.siralanabilir { cursor: pointer; user-select: none; }
    tr.kritik { background: #ffe3e3; }
    .rozet { background: #cf222e; color: #fff; border-radius: 1rem; padding: .1rem .5rem; font-size: .75rem; }
    .islemler button { margin: .1rem; padding: .25rem .5rem; font-size: .85rem; }
    #uyari { background: #fff8c5; border: 1px solid #d4a72c; padding: .6rem; border-radius: .4rem; margin-bottom: 1rem; }
    #bos { color: #656d76; }
    dialog { border: 1px solid #d0d7de; border-radius: .5rem; min-width: min(28rem, 90vw); }
    .alan { margin-bottom: .6rem; }
    .alan label { display: flex; flex-direction: column; gap: .2rem; }
    .hata { color: #cf222e; font-size: .85rem; min-height: 1em; }
    .dugmeler { display: flex; gap: .5rem; margin-top: .5rem; }
    @media (max-width: 600px) {
      .kartlar { grid-template-columns: 1fr 1fr; }
      table.urunler thead { display: none; }
      table.urunler, table.urunler tbody, table.urunler tr, table.urunler td { display: block; width: auto; }
      table.urunler tr { border: 1px solid #d0d7de; border-radius: .5rem; margin-bottom: .75rem; padding: .25rem; }
      table.urunler td { border: 0; display: flex; justify-content: space-between; gap: 1rem; }
      table.urunler td[data-label]::before { content: attr(data-label); font-weight: 600; color: #656d76; }
    }
  </style>
</head>
<body>
  <h1>Stok takip</h1>
  <div id="uyari" role="alert" hidden></div>
  <section class="kartlar">
    <div class="kart"><span>Toplam ürün</span><strong id="ozet-urun">0</strong></div>
    <div class="kart"><span>Toplam stok değeri</span><strong id="ozet-deger">0,00 ₺</strong></div>
    <div class="kart"><span>Kritik stoktaki ürün</span><strong id="ozet-kritik">0</strong></div>
    <div class="kart"><span>Bugünkü hareket</span><strong id="ozet-hareket">0</strong></div>
  </section>
  <div class="arac">
    <input type="search" id="arama" placeholder="Ad ya da SKU ara" aria-label="Ara" autocomplete="off">
    <select id="kategori" aria-label="Kategori"></select>
    <label><input type="checkbox" id="sadece-kritik"> Yalnız kritik stok</label>
    <button type="button" id="yeni-urun">Yeni ürün</button>
    <button type="button" id="csv-indir">CSV indir</button>
  </div>
  <table class="urunler">
    <thead><tr id="tablo-baslik"></tr></thead>
    <tbody id="tablo-govde"></tbody>
  </table>
  <p id="bos">Gösterilecek ürün yok.</p>
  <button type="button" id="ornek-veri" hidden>Örnek verilerle başla</button>
  <dialog id="modal">
    <h2 id="modal-baslik"></h2>
    <div id="modal-icerik"></div>
  </dialog>
  <script type="module" src="src/app.js"></script>
</body>
</html>
